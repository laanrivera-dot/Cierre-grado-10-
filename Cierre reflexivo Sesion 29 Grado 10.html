  h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px"><div style="background:#0b2e27;border-radius:14px;padding:12px 14px"><div class="P" style="font-size:11px;letter-spacing:.12em;color:#FF9C65;font-weight:700">CAPÍTULOS</div><div class="L" style="font-size:24px">'+cnt(S.mark)+'/4</div></div><div style="background:#0b2e27;border-radius:14px;padding:12px 14px"><div class="P" style="font-size:11px;letter-spacing:.12em;color:#FF9C65;font-weight:700">YA PODEMOS</div><div class="L" style="font-size:24px">'+cnt(S.can)+'/8</div></div><div style="background:#0b2e27;border-radius:14px;padding:12px 14px"><div class="P" style="font-size:11px;letter-spacing:.12em;color:#FFAF85;font-weight:700">RULETA</div><div class="L" style="font-size:24px">'+S.spins+' giros</div></div><div style="background:#0b2e27;border-radius:14px;padding:12px 14px"><div class="P" style="font-size:11px;letter-spacing:.12em;color:#FF9C65;font-weight:700">CUESTIONARIOS</div><div class="L" style="font-size:24px">'+cnt(S.q)+'/2</div></div></div>';
  h+='<div style="background:#0b2e27;border-radius:16px;padding:14px 16px;font-size:15px"><strong style="color:#FF9C65">Superpoder del equipo:</strong> '+(tops.length?tops.join(' + '):'voten en "Stats del equipo" para descubrirlo')+'</div><div style="margin-top:14px;background:#FF9C65;color:#001f19;border-radius:16px;padding:16px 18px"><div class="P" style="font-size:12px;letter-spacing:.12em;font-weight:700;margin-bottom:4px">RONDA FINAL · EN VOZ ALTA</div><div class="L" style="font-size:20px;line-height:1.35">Cada integrante completa la frase: "Este año aprendí que…"</div></div><div style="margin-top:14px;border:1.5px solid rgba(255,156,101,.5);border-radius:16px;padding:14px 16px;font-size:15px;color:#FFE4D6"><strong style="color:#fff">Lo que sigue:</strong> en la próxima sesión, <strong style="color:#FF9C65">Mi identidad integrada</strong>, reúnen todo lo que trabajaron en el contenido socio-ocupacional.</div></div>';
  return h+'<div style="margin-top:16px"><button class="P" data-act="reset" style="font-weight:600;font-size:14px;color:#8A3A0E;background:#FFF1E8;border:none;border-radius:24px;padding:12px 22px">↺ Reiniciar para otro equipo</button></div>';
};
function renderIdx(){
  var el=document.getElementById('idx');if(!S.idx){el.innerHTML='';return;}
  var h='<div class="pop" style="background:#fff;border:2px solid #001F19;border-radius:18px;padding:16px 18px;margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="P" style="font-weight:700;font-size:15px;color:#001f19">Índice · salta a cualquier parte</div><button data-act="index" style="border:none;background:#FFF1E8;color:#8A3A0E;border-radius:14px;padding:4px 12px;font-weight:700">✕</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">';
  GROUPS.forEach(function(g){h+='<div><div class="P" style="font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#3d4a47;margin-bottom:6px">'+g[0]+'</div><div style="display:flex;flex-direction:column;gap:6px">';g[1].forEach(function(i){var on=S.p===i;h+='<button class="P" data-act="go" data-i="'+i+'" style="text-align:left;font-weight:600;font-size:14px;border:1.5px solid #FBDCC8;border-radius:12px;padding:8px 12px;background:'+(on?'#001F19':'#FFF8F3')+';color:'+(on?'#FF9C65':'#001F19')+'">'+SCREENS[i]+'</button>';});h+='</div></div>';});
  el.innerHTML=h+'</div></div>';
}
function render(){
  document.getElementById('app').innerHTML='<div class="pop">'+R[S.p]()+'</div>';
  document.getElementById('fill').style.width=Math.round((S.p+1)/SCREENS.length*100)+'%';
  document.getElementById('cnt').textContent='Pantalla '+(S.p+1)+' de '+SCREENS.length;
  document.getElementById('prev').style.visibility=S.p>0?'visible':'hidden';
  var n=document.getElementById('next');n.style.display=S.p<SCREENS.length-1?'':'none';n.textContent=NEXT[S.p]||'';
  renderIdx();
}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y);}
function go(i){S.p=Math.max(0,Math.min(SCREENS.length-1,i));S.idx=false;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function tick(){T.t--;if(T.t<=0){T.t=0;clearInterval(T.h);T.run=false;rerender();return;}var e=document.getElementById('tm');if(e)e.textContent=Math.floor(T.t/60)+':'+('0'+T.t%60).slice(-2);}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act'),i=+b.getAttribute('data-i'),k=b.getAttribute('data-k');
  switch(a){
    case 'index':S.idx=!S.idx;save();renderIdx();return;
    case 'go':go(i);return;
    case 'next':go(S.p+1);return;
    case 'prev':go(S.p-1);return;
    case 'chk':S.chk=i;break;
    case 'stop':if(i<S.got)return;if(i===S.got){S.got++;wrong=-1;}else{wrong=i;rerender();setTimeout(function(){wrong=-1;},400);return;}break;
    case 'timer':if(T.run){clearInterval(T.h);T.run=false;}else{if(T.t<=0)T.t=300;T.run=true;clearInterval(T.h);T.h=setInterval(tick,1000);}break;
    case 'treset':clearInterval(T.h);T.run=false;T.t=300;break;
    case 'flip':S.open[i]=!S.open[i];break;
    case 'mark':S.mark[i]=!S.mark[i];S.open[i]=true;break;
    case 'socio':S.socio[i]=!S.socio[i];break;
    case 'can':S.can[i]=!S.can[i];break;
    case 'qdone':S.q=S.q||{};S.q[i]=!S.q[i];break;
    case 'ans':if(S.ans[S.qi]===undefined)S.ans[S.qi]=i;break;
    case 'nextq':S.qi=Math.min(QUIZ.length-1,S.qi+1);break;
    case 'spin':var pool=[],j;for(j=0;j<SPIN.length;j++)if(S.used.indexOf(j)<0)pool.push(j);if(!pool.length){S.used=[];for(j=0;j<SPIN.length;j++)if(j!==S.spinIdx)pool.push(j);}var n=pool[Math.floor(Math.random()*pool.length)];S.spinIdx=n;S.spins++;S.used.push(n);break;
    case 'inc':S.sk[k]=(S.sk[k]||0)+1;break;
    case 'dec':S.sk[k]=Math.max(0,(S.sk[k]||0)-1);break;
    case 'rev':S.rev[i]=!S.rev[i];break;
    case 'reset':clearInterval(T.h);T={t:300,run:false,h:null};S=init();save();render();window.scrollTo(0,0);return;
  }
  save();rerender();
});
render();
})();
</script>
